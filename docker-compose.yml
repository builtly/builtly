services:
  builtly:
    build: .
    environment:
      # Unconfigured on purpose — complete /admin/#/setup after start (default: SQLite on /data).
      BUILTLY_ENV: development
      BUILTLY_HTTP_ADDR: ":8080"
      BUILTLY_DATA_DIR: /data
      BUILTLY_LOG_FORMAT: text
      BUILTLY_LOG_LEVEL: info
      BUILTLY_WORKERS_ENABLED: "true"
      BUILTLY_SETUP_TOKEN: local-setup-token-change-me-please-32b
    volumes:
      - builtly-data:/data
    ports:
      - "8080:8080"

  # Optional Postgres for CI / dialect tests: docker compose --profile test run --rm test
  postgres:
    profiles: ["test", "postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: builtly
      POSTGRES_PASSWORD: builtly
      POSTGRES_DB: builtly
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builtly -d builtly"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/02-test.sql:ro

  test:
    profiles: ["test"]
    image: golang:1.26-bookworm
    working_dir: /src
    volumes:
      - .:/src
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BUILTLY_TEST_DATABASE_URL: postgres://builtly:builtly@postgres:5432/builtly_test?sslmode=disable
      BUILTLY_TEST_POSTGRES: "1"
      CGO_ENABLED: "1"
    command: ["go", "test", "-race", "./..."]

volumes:
  builtly-data:
  pgdata:
