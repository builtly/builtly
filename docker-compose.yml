services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: builtly
      POSTGRES_PASSWORD: builtly
      POSTGRES_DB: builtly
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builtly -d builtly"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/02-test.sql:ro

  builtly:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BUILTLY_ENV: development
      BUILTLY_HTTP_ADDR: ":8080"
      BUILTLY_PUBLIC_URL: http://localhost:8080
      BUILTLY_DB_DRIVER: postgres
      BUILTLY_DB_DSN: postgres://builtly:builtly@postgres:5432/builtly?sslmode=disable
      BUILTLY_AUTO_MIGRATE: "true"
      BUILTLY_JWT_SIGNING_KEYS: "dev:qEoaBIE2I3L2faoeQTWiQjP+2V+/Ce1U+86KjIkasyg="
      BUILTLY_ENCRYPTION_KEYS: "1:eZlukPQGNLHYjsJFhveSsm3V0Kpy3Fj8Nt6Qp1At2Sc="
      BUILTLY_ADMIN_TOKEN: "ukfX1OPsLVywObS7p3dVtH3/bRdNqnsYZ9YzLSroIZA="
      BUILTLY_LOG_FORMAT: text
      BUILTLY_LOG_LEVEL: info
      BUILTLY_WORKERS_ENABLED: "false"
    ports:
      - "8080:8080"

  test:
    image: golang:1.26-bookworm
    working_dir: /src
    volumes:
      - .:/src
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BUILTLY_TEST_DATABASE_URL: postgres://builtly:builtly@postgres:5432/builtly_test?sslmode=disable
      BUILTLY_TEST_POSTGRES: "1"
      CGO_ENABLED: "1"
    command: ["go", "test", "-race", "./..."]

volumes:
  pgdata:
